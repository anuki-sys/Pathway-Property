<script>
(function () {
  var toggle = document.querySelector('.nav-toggle');
  var nav = document.querySelector('.nav');
  if (toggle && nav) {
    toggle.addEventListener('click', function () {
      var open = nav.classList.toggle('is-open');
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  }

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var canObserve = 'IntersectionObserver' in window;

  // Reveals. A single element fades up; a .stagger group sends its children in
  // sequence; a photograph settles out of a slight scale.
  var revealables = document.querySelectorAll('.reveal, .stagger, .media');

  function show(el) {
    el.classList.add('is-in');
    if (el.classList.contains('stagger')) {
      var kids = el.children;
      for (var i = 0; i < kids.length; i++) {
        kids[i].style.transitionDelay = Math.min(i * 70, 420) + 'ms';
      }
    }
  }

  if (reduced || !canObserve) {
    for (var r = 0; r < revealables.length; r++) revealables[r].classList.add('is-in');
  } else {
    // Arm the media only once the script is running, so a slow connection
    // never leaves a photograph hidden behind a class that never lifts.
    document.querySelectorAll('.media').forEach(function (m) { m.classList.add('is-armed'); });

    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        show(entry.target);
        io.unobserve(entry.target);
      });
    }, { rootMargin: '0px 0px -6% 0px', threshold: 0.08 });

    for (var j = 0; j < revealables.length; j++) io.observe(revealables[j]);
  }

  // The hero photograph lifts a little against the scroll. Capped hard, and
  // driven off rAF so it never fights the scroll thread.
  var heroImg = document.querySelector('.hero__media img');
  if (heroImg && !reduced) {
    var ticking = false;
    var applyParallax = function () {
      var shift = Math.max(-26, Math.min(0, -window.scrollY * 0.045));
      heroImg.style.transform = 'translate3d(0,' + shift + 'px,0)';
      ticking = false;
    };
    window.addEventListener('scroll', function () {
      if (ticking) return;
      ticking = true;
      window.requestAnimationFrame(applyParallax);
    }, { passive: true });
  }

  // FAQ answers open and close on a measured height instead of snapping.
  document.querySelectorAll('.faq__item').forEach(function (item) {
    var summary = item.querySelector('summary');
    var answer = item.querySelector('.faq__answer');
    if (!summary || !answer || reduced) return;

    function settle() {
      item.classList.remove('is-animating');
      answer.style.height = '';
      answer.style.opacity = '';
    }

    summary.addEventListener('click', function (e) {
      e.preventDefault();
      if (item.classList.contains('is-animating')) return;
      item.classList.add('is-animating');

      if (item.open) {
        answer.style.height = answer.scrollHeight + 'px';
        requestAnimationFrame(function () {
          answer.style.height = '0px';
          answer.style.opacity = '0';
        });
        answer.addEventListener('transitionend', function done(ev) {
          if (ev.propertyName !== 'height') return;
          answer.removeEventListener('transitionend', done);
          item.open = false;
          settle();
        });
      } else {
        item.open = true;
        var target = answer.scrollHeight;
        answer.style.height = '0px';
        answer.style.opacity = '0';
        requestAnimationFrame(function () {
          answer.style.height = target + 'px';
          answer.style.opacity = '1';
        });
        answer.addEventListener('transitionend', function done(ev) {
          if (ev.propertyName !== 'height') return;
          answer.removeEventListener('transitionend', done);
          settle();
        });
      }
    });
  });

  // Header condenses once the page has moved.
  var header = document.querySelector('.site-header');
  if (header) {
    var onScroll = function () {
      header.classList.toggle('is-scrolled', window.scrollY > 24);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }

  // Slider. One per page is plenty; used by the testimonials.
  document.querySelectorAll('.slider').forEach(function (slider) {
    var track = slider.querySelector('.slider__track');
    var slides = slider.querySelectorAll('.slider__slide');
    var prev = slider.querySelector('[data-slider="prev"]');
    var next = slider.querySelector('[data-slider="next"]');
    var dotWrap = slider.querySelector('.slider__dots');
    var dots = [];
    var index = 0;

    function perView() {
      if (!slides.length) return 1;
      var vw = slider.querySelector('.slider__viewport').clientWidth;
      return Math.max(1, Math.round(vw / slides[0].getBoundingClientRect().width));
    }

    function maxIndex() { return Math.max(0, slides.length - perView()); }

    // One dot per reachable position, rebuilt whenever the per-view count
    // changes, so there are never dots that cannot be scrolled to.
    function buildDots() {
      if (!dotWrap) return;
      var count = maxIndex() + 1;
      if (dots.length === count) return;
      dotWrap.innerHTML = '';
      dots = [];
      for (var i = 0; i < count; i++) {
        var dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'slider__dot';
        dot.setAttribute('aria-label', 'Go to review ' + (i + 1));
        dot.addEventListener('click', (function (d) {
          return function () { go(d); };
        })(i));
        dotWrap.appendChild(dot);
        dots.push(dot);
      }
    }

    function go(i) {
      index = Math.max(0, Math.min(i, maxIndex()));
      var slide = slides[index];
      if (!slide) return;
      track.style.transform = 'translateX(' + (-slide.offsetLeft) + 'px)';
      if (prev) prev.disabled = index === 0;
      if (next) next.disabled = index === maxIndex();
      dots.forEach(function (dot, d) { dot.setAttribute('aria-current', d === index ? 'true' : 'false'); });
    }

    if (prev) prev.addEventListener('click', function () { go(index - 1); });
    if (next) next.addEventListener('click', function () { go(index + 1); });
    slider.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft') { go(index - 1); }
      if (e.key === 'ArrowRight') { go(index + 1); }
    });

    // Drag and swipe.
    var startX = null;
    slider.addEventListener('pointerdown', function (e) { startX = e.clientX; });
    slider.addEventListener('pointerup', function (e) {
      if (startX === null) return;
      var dx = e.clientX - startX;
      if (Math.abs(dx) > 45) go(index + (dx < 0 ? 1 : -1));
      startX = null;
    });

    window.addEventListener('resize', function () { buildDots(); go(index); });
    buildDots();
    go(0);
  });

  // Lite YouTube embed. Poster first, iframe only on click.
  document.querySelectorAll('.lite-video[data-video]').forEach(function (el) {
    el.addEventListener('click', function () {
      var id = el.getAttribute('data-video');
      if (!id) return;
      el.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + id +
        '?autoplay=1" title="Sira Finance property breakdown" allow="accelerometer; autoplay; ' +
        'clipboard-write; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
    });
  });
})();
</script>
</body>
</html>
