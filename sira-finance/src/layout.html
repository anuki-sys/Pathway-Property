<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="{{FAVICON}}">
<script>document.documentElement.classList.add("js");</script>
<style>
:root { --wave-src: {{WAVE_SRC}}; }
{{FONTS}}
{{CSS}}
</style>
{{SCHEMA}}
</head>
<body>
{{DRAFTBAR}}
{{NAV}}
<main id="main">
{{BODY}}
</main>
{{FOOTER}}

<div class="callbar" role="complementary" aria-label="Get in touch">
  <span class="callbar__text">Not sure where you stand?</span>
  <a class="btn btn--light btn--sm" href="/apply/">Book a call</a>
</div>
<script>
(function () {
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var mobileNav = window.matchMedia('(max-width: 991px)');

  // ---------------------------------------------------------------- navigation
  var toggle = document.querySelector('.nav-toggle');
  var nav = document.querySelector('.nav');
  var navItems = [].slice.call(document.querySelectorAll('.nav__item.has-menu'));

  function closeMenus(except) {
    navItems.forEach(function (item) {
      if (item === except) return;
      item.classList.remove('is-open');
      var btn = item.querySelector('.nav__link');
      var panel = item.querySelector('.nav__menu');
      if (btn) btn.setAttribute('aria-expanded', 'false');
      if (panel && mobileNav.matches) panel.style.height = '0px';
      if (panel && !mobileNav.matches) panel.hidden = true;
    });
  }

  function openMenu(item) {
    closeMenus(item);
    item.classList.add('is-open');
    var btn = item.querySelector('.nav__link');
    var panel = item.querySelector('.nav__menu');
    if (btn) btn.setAttribute('aria-expanded', 'true');
    if (!panel) return;
    panel.hidden = false;
    if (mobileNav.matches) {
      panel.style.height = panel.firstElementChild.offsetHeight + 'px';
    }
  }

  function closeMenu(item) {
    item.classList.remove('is-open');
    var btn = item.querySelector('.nav__link');
    var panel = item.querySelector('.nav__menu');
    if (btn) btn.setAttribute('aria-expanded', 'false');
    if (!panel) return;
    if (mobileNav.matches) { panel.style.height = '0px'; }
    else { panel.hidden = true; }
  }

  navItems.forEach(function (item) {
    var btn = item.querySelector('.nav__link');
    var panel = item.querySelector('.nav__menu');
    if (!btn || !panel) return;
    panel.hidden = !mobileNav.matches;
    if (mobileNav.matches) panel.style.height = '0px';

    btn.addEventListener('click', function () {
      item.classList.contains('is-open') ? closeMenu(item) : openMenu(item);
    });

    // Pointer opens the panel on a desktop, with a short close delay so the
    // cursor can cross the gap between the label and the panel.
    var timer;
    item.addEventListener('pointerenter', function () {
      if (mobileNav.matches) return;
      clearTimeout(timer);
      openMenu(item);
    });
    item.addEventListener('pointerleave', function () {
      if (mobileNav.matches) return;
      timer = setTimeout(function () { closeMenu(item); }, 160);
    });
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeMenus(null);
  });
  document.addEventListener('click', function (e) {
    if (nav && !nav.contains(e.target) && (!toggle || !toggle.contains(e.target))) closeMenus(null);
  });

  if (toggle && nav) {
    toggle.addEventListener('click', function () {
      var open = nav.classList.toggle('is-open');
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      if (!open) closeMenus(null);
    });
  }

  // ---------------------------------------------------- scenario picker (tabs)
  document.querySelectorAll('[data-picker]').forEach(function (picker) {
    var tabs = [].slice.call(picker.querySelectorAll('[role="tab"]'));
    var panel = picker.querySelector('.picker__panel');
    if (!tabs.length || !panel) return;

    function render(tab) {
      var fill = function () {
        panel.querySelector('[data-field="label"]').textContent = tab.dataset.label || '';
        panel.querySelector('[data-field="title"]').textContent = tab.dataset.title || '';
        panel.querySelector('[data-field="body"]').textContent = tab.dataset.body || '';
        var primary = panel.querySelector('[data-field="primary"]');
        primary.setAttribute('href', tab.dataset.href || '#');
        primary.textContent = tab.dataset.cta || 'Read more';
        [1, 2].forEach(function (n) {
          var link = panel.querySelector('[data-field="guide' + n + '"]');
          if (!link) return;
          link.setAttribute('href', tab.dataset['guide' + n + 'Href'] || '#');
          link.textContent = tab.dataset['guide' + n + 'Label'] || '';
        });
      };
      if (reduced) { fill(); return; }
      panel.classList.add('is-swapping');
      setTimeout(function () { fill(); panel.classList.remove('is-swapping'); }, 180);
    }

    function select(tab, focus) {
      tabs.forEach(function (t) {
        var on = t === tab;
        t.setAttribute('aria-selected', on ? 'true' : 'false');
        t.setAttribute('tabindex', on ? '0' : '-1');
      });
      if (focus) tab.focus();
      tabs.forEach(function (t) {
        var go = t.querySelector('.tile__go');
        if (go) go.firstChild.textContent = (t === tab ? 'Selected ' : 'Select ');
      });
      render(tab);
    }

    tabs.forEach(function (tab, i) {
      tab.addEventListener('click', function () { select(tab); });
      tab.addEventListener('keydown', function (e) {
        var next = null;
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next = tabs[(i + 1) % tabs.length];
        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') next = tabs[(i - 1 + tabs.length) % tabs.length];
        if (e.key === 'Home') next = tabs[0];
        if (e.key === 'End') next = tabs[tabs.length - 1];
        if (!next) return;
        e.preventDefault();
        select(next, true);
      });
    });

    select(tabs[0]);
  });

  // ------------------------------------------------------- comparison switch
  document.querySelectorAll('[data-compare]').forEach(function (block) {
    var buttons = [].slice.call(block.querySelectorAll('.switch button'));
    var rows = block.querySelector('.compare__rows');
    if (!buttons.length || !rows) return;

    var sets = {};
    block.querySelectorAll('template[data-set]').forEach(function (tpl) {
      sets[tpl.dataset.set] = tpl.innerHTML;
    });

    function show(key) {
      var swap = function () { rows.innerHTML = sets[key] || ''; };
      if (reduced) { swap(); return; }
      rows.classList.add('is-swapping');
      setTimeout(function () { swap(); rows.classList.remove('is-swapping'); }, 160);
    }

    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        buttons.forEach(function (b) { b.setAttribute('aria-selected', b === btn ? 'true' : 'false'); });
        show(btn.dataset.set);
      });
    });

    show(buttons[0].dataset.set);
    buttons[0].setAttribute('aria-selected', 'true');
  });

  // ------------------------------------------------------------- process rail
  var steps = document.querySelector('.steps');
  var rail = document.querySelector('.steps-rail__fill');
  if (steps && rail && !reduced) {
    var stepEls = [].slice.call(steps.querySelectorAll('.step'));
    var railTick = false;
    var drawRail = function () {
      var box = steps.getBoundingClientRect();
      var start = window.innerHeight * 0.85;
      var span = box.height + start - window.innerHeight * 0.25;
      var progress = Math.max(0, Math.min(1, (start - box.top) / span));
      rail.style.width = (progress * 100) + '%';
      steps.classList.add('is-lit');
      stepEls.forEach(function (el, i) {
        el.classList.toggle('is-passed', progress >= (i + 0.35) / stepEls.length);
      });
      railTick = false;
    };
    window.addEventListener('scroll', function () {
      if (railTick) return;
      railTick = true;
      window.requestAnimationFrame(drawRail);
    }, { passive: true });
    drawRail();
  }

  // ------------------------------------------------------------- sticky callbar
  var callbar = document.querySelector('.callbar');
  if (callbar) {
    var hero = document.querySelector('.hero');
    var barTick = false;
    var placeBar = function () {
      var past = hero ? hero.getBoundingClientRect().bottom < 0 : window.scrollY > 600;
      var atEnd = window.scrollY + window.innerHeight > document.documentElement.scrollHeight - 240;
      callbar.classList.toggle('is-up', past && !atEnd);
      barTick = false;
    };
    window.addEventListener('scroll', function () {
      if (barTick) return;
      barTick = true;
      window.requestAnimationFrame(placeBar);
    }, { passive: true });
    placeBar();
  }

  var canObserve = 'IntersectionObserver' in window;

  // Reveals. A single element fades up; a .stagger group sends its children in
  // sequence; a photograph settles out of a slight scale.
  var revealables = document.querySelectorAll('.reveal, .stagger, .media');

  function show(el) {
    el.classList.add('is-in');
    if (el.classList.contains('stagger')) {
      var kids = el.children;
      for (var i = 0; i < kids.length; i++) {
        kids[i].style.transitionDelay = Math.min(i * 70, 420) + 'ms';
      }
    }
  }

  if (reduced || !canObserve) {
    for (var r = 0; r < revealables.length; r++) revealables[r].classList.add('is-in');
  } else {
    // Arm the media only once the script is running, so a slow connection
    // never leaves a photograph hidden behind a class that never lifts.
    document.querySelectorAll('.media').forEach(function (m) { m.classList.add('is-armed'); });

    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        show(entry.target);
        io.unobserve(entry.target);
      });
    }, { rootMargin: '0px 0px -6% 0px', threshold: 0.08 });

    for (var j = 0; j < revealables.length; j++) io.observe(revealables[j]);
  }

  // The hero photograph lifts a little against the scroll. Capped hard, and
  // driven off rAF so it never fights the scroll thread.
  var heroImg = document.querySelector('.hero__media img');
  if (heroImg && !reduced) {
    var ticking = false;
    var applyParallax = function () {
      var shift = Math.max(-26, Math.min(0, -window.scrollY * 0.045));
      heroImg.style.transform = 'translate3d(0,' + shift + 'px,0)';
      ticking = false;
    };
    window.addEventListener('scroll', function () {
      if (ticking) return;
      ticking = true;
      window.requestAnimationFrame(applyParallax);
    }, { passive: true });
  }

  // FAQ answers open and close on a measured height instead of snapping.
  document.querySelectorAll('.faq__item').forEach(function (item) {
    var summary = item.querySelector('summary');
    var answer = item.querySelector('.faq__answer');
    if (!summary || !answer || reduced) return;

    function settle() {
      item.classList.remove('is-animating');
      answer.style.height = '';
      answer.style.opacity = '';
    }

    summary.addEventListener('click', function (e) {
      e.preventDefault();
      if (item.classList.contains('is-animating')) return;
      item.classList.add('is-animating');

      if (item.open) {
        answer.style.height = answer.scrollHeight + 'px';
        requestAnimationFrame(function () {
          answer.style.height = '0px';
          answer.style.opacity = '0';
        });
        answer.addEventListener('transitionend', function done(ev) {
          if (ev.propertyName !== 'height') return;
          answer.removeEventListener('transitionend', done);
          item.open = false;
          settle();
        });
      } else {
        item.open = true;
        var target = answer.scrollHeight;
        answer.style.height = '0px';
        answer.style.opacity = '0';
        requestAnimationFrame(function () {
          answer.style.height = target + 'px';
          answer.style.opacity = '1';
        });
        answer.addEventListener('transitionend', function done(ev) {
          if (ev.propertyName !== 'height') return;
          answer.removeEventListener('transitionend', done);
          settle();
        });
      }
    });
  });

  // Header condenses once the page has moved.
  var header = document.querySelector('.site-header');
  if (header) {
    var onScroll = function () {
      header.classList.toggle('is-scrolled', window.scrollY > 24);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }

  // Slider. One per page is plenty; used by the testimonials.
  document.querySelectorAll('.slider').forEach(function (slider) {
    var track = slider.querySelector('.slider__track');
    var slides = slider.querySelectorAll('.slider__slide');
    var prev = slider.querySelector('[data-slider="prev"]');
    var next = slider.querySelector('[data-slider="next"]');
    var dotWrap = slider.querySelector('.slider__dots');
    var dots = [];
    var index = 0;

    function perView() {
      if (!slides.length) return 1;
      var vw = slider.querySelector('.slider__viewport').clientWidth;
      return Math.max(1, Math.round(vw / slides[0].getBoundingClientRect().width));
    }

    function maxIndex() { return Math.max(0, slides.length - perView()); }

    // One dot per reachable position, rebuilt whenever the per-view count
    // changes, so there are never dots that cannot be scrolled to.
    function buildDots() {
      if (!dotWrap) return;
      var count = maxIndex() + 1;
      if (dots.length === count) return;
      dotWrap.innerHTML = '';
      dots = [];
      for (var i = 0; i < count; i++) {
        var dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'slider__dot';
        dot.setAttribute('aria-label', 'Go to review ' + (i + 1));
        dot.addEventListener('click', (function (d) {
          return function () { go(d); };
        })(i));
        dotWrap.appendChild(dot);
        dots.push(dot);
      }
    }

    function go(i) {
      index = Math.max(0, Math.min(i, maxIndex()));
      var slide = slides[index];
      if (!slide) return;
      track.style.transform = 'translateX(' + (-slide.offsetLeft) + 'px)';
      if (prev) prev.disabled = index === 0;
      if (next) next.disabled = index === maxIndex();
      dots.forEach(function (dot, d) { dot.setAttribute('aria-current', d === index ? 'true' : 'false'); });
    }

    if (prev) prev.addEventListener('click', function () { go(index - 1); });
    if (next) next.addEventListener('click', function () { go(index + 1); });
    slider.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft') { go(index - 1); }
      if (e.key === 'ArrowRight') { go(index + 1); }
    });

    // Drag and swipe.
    var startX = null;
    slider.addEventListener('pointerdown', function (e) { startX = e.clientX; });
    slider.addEventListener('pointerup', function (e) {
      if (startX === null) return;
      var dx = e.clientX - startX;
      if (Math.abs(dx) > 45) go(index + (dx < 0 ? 1 : -1));
      startX = null;
    });

    window.addEventListener('resize', function () { buildDots(); go(index); });
    buildDots();
    go(0);
  });

  // Lite YouTube embed. Poster first, iframe only on click.
  document.querySelectorAll('.lite-video[data-video]').forEach(function (el) {
    el.addEventListener('click', function () {
      var id = el.getAttribute('data-video');
      if (!id) return;
      el.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + id +
        '?autoplay=1" title="Sira Finance property breakdown" allow="accelerometer; autoplay; ' +
        'clipboard-write; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
    });
  });
})();
</script>
</body>
</html>
