<!--
Pathway Property Website (Webflow site id 64d063d22c0ee57d46bfca71)
"Book a Call" page (/book-a-call) > Page settings > Custom code > Footer code.

Two jobs:

1. Layout. The page reuses the Contact page's two-column card, but here the
   calendar takes the full width and the contact details sit underneath it in a
   single row. Every override below is page-level: .left-contat-details,
   .div-block-23 and .form-wrapper are shared with the Contact page and must
   keep their own layout there.

   Note these blocks are ALREADY display:flex in the Designer, laid out as tall
   columns for the Contact page's left rail. Setting display:flex here changes
   nothing - flex-direction, gap and padding are what actually need overriding.

2. The calendar. It is injected into the empty .pp-booking-calendar block rather
   than sitting in the layout, because Webflow strips raw <iframe> elements from
   the canvas. The trade-off: the calendar does NOT appear in Designer Preview,
   since custom code only runs on a published site.
-->
<style>
/* One full-width column instead of details | form. */
.contact-grid { display: block; }

/* Close the gap above the calendar. 30px of it is .form-wrapper's row gap;
   what remains is padding inside GoHighLevel's own iframe, which we cannot
   reach from out here, so the negative margin absorbs some of it. */
.form-wrapper.ghl-embed { grid-row-gap: 0px; row-gap: 0px; }
.pp-booking-calendar { margin-top: -18px; }

/* The details block: one row under the calendar, not the Contact page's tall
   column. It arrives here as flex-direction:column with a 10em gap and 50px
   padding, so all three have to be overridden by name. */
.left-contat-details {
  flex-direction: row;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-start;
  grid-column-gap: 56px;
  grid-row-gap: 24px;
  gap: 24px 56px;
  height: auto;
  margin-top: 26px;
  padding: 26px 0 0;
  border-top: 1px solid rgba(17, 28, 51, 0.12);
}
/* The three quick links, side by side. */
.left-contat-details > div:first-child {
  flex-direction: row;
  flex-wrap: wrap;
  align-items: center;
  grid-column-gap: 56px;
  grid-row-gap: 24px;
  gap: 24px 56px;
  height: auto;
}
/* Follow Us, pushed to the far end of the row. */
.left-contat-details > div:last-child {
  margin-left: auto;
  height: auto;
}
</style>
<script>
(function () {
  var CALENDAR_ID = 'y5S2LntDv7EcKh9wdIs6';
  var slot = document.querySelector('.pp-booking-calendar');
  if (!slot || slot.querySelector('iframe')) return;

  var frame = document.createElement('iframe');
  frame.src = 'https://api.leadconnectorhq.com/widget/booking/' + CALENDAR_ID;
  // GoHighLevel's script resizes the iframe it finds under this id.
  frame.id = CALENDAR_ID + '_' + Date.now();
  frame.title = 'Book a Discovery Call';
  frame.setAttribute('allow', 'payment');
  frame.setAttribute('scrolling', 'no');
  frame.style.width = '100%';
  frame.style.border = 'none';
  frame.style.overflow = 'hidden';
  frame.style.display = 'block';
  // Height until GoHighLevel measures the calendar; also the fallback if that
  // handshake never lands.
  frame.style.height = '700px';
  slot.appendChild(frame);

  var s = document.createElement('script');
  s.type = 'text/javascript';
  s.src = 'https://link.msgsndr.com/js/form_embed.js';
  document.body.appendChild(s);
})();
</script>
