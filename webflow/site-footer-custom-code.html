<!--
Pathway Property Website (Webflow site id 64d063d22c0ee57d46bfca71)
Site settings > Custom code > Footer code.

Subscribe popup ("Don't Fall Behind... Subscribe Now", .popup-overlay):
  - held shut by the pp-popup-lock class set in the head code
  - opens 20 seconds after load
  - at most once every 7 days per browser (cookie "pp_popup_seen")
-->
<script>
(function () {
  var COOKIE = 'pp_popup_seen', DELAY = 20000, DAYS = 7;

  function seen() {
    return document.cookie.split('; ').indexOf(COOKIE + '=1') !== -1;
  }

  function remember() {
    var d = new Date();
    d.setTime(d.getTime() + DAYS * 86400000);
    document.cookie = COOKIE + '=1; expires=' + d.toUTCString() + '; path=/; SameSite=Lax';
  }

  function setDisplay(value) {
    var els = document.querySelectorAll('.popup-overlay');
    for (var i = 0; i < els.length; i++) els[i].style.display = value;
  }

  setTimeout(function () {
    var show = !seen();
    // Clear whatever a page-load interaction left behind, then release the lock.
    setDisplay(show ? 'flex' : 'none');
    document.documentElement.classList.remove('pp-popup-lock');
    if (show) remember();
  }, DELAY);

  // Make sure the popup can always be dismissed.
  document.addEventListener('click', function (e) {
    if (!e.target || !e.target.closest) return;
    if (e.target.closest('.shut-pop-up, .close-button') ||
        e.target.closest('.popup-overlay .secondary-button') ||
        (e.target.classList && e.target.classList.contains('popup-overlay'))) {
      setDisplay('none');
    }
  });
})();
</script>

<!--
GoHighLevel "Discovery Call" calendar.

A Webflow form carrying the custom attribute data-pp-booking="discovery-call"
swaps its success message for the booking calendar, so the calendar appears in
the same area the form occupied. Right now that attribute is on the Contact
page enquiry form (#wf-form-contact-form) only; to switch another form over,
add the same attribute to it in the Designer - nothing here needs changing.

The existing "Submitted Successfully / We'll aim to get back to you in 24hrs /
Submit Another Enquiery" content is hidden, not removed, so the calendar is the
only thing in that area.

The GoHighLevel embed script is fetched on demand, the first time a calendar is
actually shown, rather than on every page load.
-->
<style>
.pp-booking-was-here { display: none !important; }
.pp-booking { width: 100%; }
.pp-booking-intro { margin-bottom: 16px; }
</style>
<script>
(function () {
  var CALENDAR_ID = 'y5S2LntDv7EcKh9wdIs6';
  var WIDGET_URL = 'https://api.leadconnectorhq.com/widget/booking/' + CALENDAR_ID;
  var EMBED_JS = 'https://link.msgsndr.com/js/form_embed.js';
  var FORM_SELECTOR = 'form[data-pp-booking="discovery-call"]';

  // Height before GoHighLevel's script measures the calendar and resizes the
  // iframe. Also the height people see if that handshake never lands.
  var FALLBACK_HEIGHT = '720px';

  // Carry the name, email and phone just submitted into the booking form so
  // nobody types them twice. Set to false to send people to a blank calendar.
  var PREFILL = true;

  // Optional line above the calendar, e.g.
  // 'Thanks - we have your enquiry. Pick a time that suits you.'
  // Empty means the calendar stands on its own.
  var INTRO = '';

  var embedRequested = false;

  function loadEmbedScript() {
    if (embedRequested) return;
    embedRequested = true;
    var s = document.createElement('script');
    s.type = 'text/javascript';
    s.src = EMBED_JS;
    document.body.appendChild(s);
  }

  // Read the values while the form is still filled in - Webflow hides the form
  // on success and we want what the person typed, not an empty form.
  function readAnswers(form) {
    var out = { name: '', email: '', phone: '' };
    var inputs = form.querySelectorAll('input, textarea');
    for (var i = 0; i < inputs.length; i++) {
      var el = inputs[i];
      var type = (el.type || '').toLowerCase();
      var name = (el.name || '').toLowerCase();
      var value = (el.value || '').trim();
      if (!value || type === 'checkbox' || type === 'radio' || type === 'submit') continue;
      if (!out.email && (type === 'email' || name.indexOf('email') !== -1)) { out.email = value; continue; }
      if (!out.phone && (type === 'tel' || name.indexOf('phone') !== -1)) { out.phone = value; continue; }
      if (!out.name && name.indexOf('name') !== -1) { out.name = value; }
    }
    return out;
  }

  function widgetUrl(a) {
    if (!PREFILL) return WIDGET_URL;
    var q = [];
    if (a.email) q.push('email=' + encodeURIComponent(a.email));
    if (a.phone) q.push('phone=' + encodeURIComponent(a.phone));
    if (a.name) {
      var parts = a.name.split(/\s+/);
      q.push('first_name=' + encodeURIComponent(parts.shift()));
      if (parts.length) q.push('last_name=' + encodeURIComponent(parts.join(' ')));
    }
    return q.length ? WIDGET_URL + '?' + q.join('&') : WIDGET_URL;
  }

  function showCalendar(done, a) {
    if (done.getAttribute('data-pp-booking-ready') === '1') return;
    done.setAttribute('data-pp-booking-ready', '1');

    var kids = done.children;
    for (var i = 0; i < kids.length; i++) {
      kids[i].className = (kids[i].className + ' pp-booking-was-here').trim();
    }

    var wrap = document.createElement('div');
    wrap.className = 'pp-booking';

    if (INTRO) {
      var intro = document.createElement('div');
      intro.className = 'pp-booking-intro text-regular';
      intro.textContent = INTRO;
      wrap.appendChild(intro);
    }

    var frame = document.createElement('iframe');
    frame.src = widgetUrl(a);
    // GoHighLevel's embed script resizes the iframe it finds under this id.
    frame.id = CALENDAR_ID + '_' + Date.now();
    frame.title = 'Book a Discovery Call';
    frame.setAttribute('allow', 'payment');
    frame.setAttribute('scrolling', 'no');
    frame.style.width = '100%';
    frame.style.border = 'none';
    frame.style.overflow = 'hidden';
    frame.style.display = 'block';
    frame.style.height = FALLBACK_HEIGHT;
    wrap.appendChild(frame);

    done.appendChild(wrap);
    loadEmbedScript();
  }

  function visible(el) {
    return window.getComputedStyle(el).display !== 'none';
  }

  function watch(form) {
    var shell = form.closest('.w-form');
    if (!shell) return;
    var done = shell.querySelector('.w-form-done');
    if (!done) return;

    var answers = null;

    form.addEventListener('submit', function () {
      answers = readAnswers(form);
    });

    // Webflow reveals .w-form-done once the submission succeeds; that reveal is
    // the only signal it gives us. Requiring a submit first keeps a stray
    // "display" on the success class from putting a calendar on the page before
    // anyone has enquired, and a failed submit shows .w-form-fail instead.
    new MutationObserver(function () {
      if (answers && visible(done)) showCalendar(done, answers);
    }).observe(done, { attributes: true, attributeFilter: ['style', 'class'] });
  }

  function init() {
    var forms = document.querySelectorAll(FORM_SELECTOR);
    for (var i = 0; i < forms.length; i++) watch(forms[i]);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
