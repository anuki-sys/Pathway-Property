<!--
Pathway Property Website (Webflow site id 64d063d22c0ee57d46bfca71)
Contact page (/contact) > HTML Embed inside .contact-form-wrapper.
This file mirrors that embed's contents exactly - keep the two in step.

GoHighLevel form "Website Enquiry Form" (id om3C2pvl8k921QOQIzZ3).
Replaces the native Webflow "contact form", which is still on this page but
hidden by the .forms.legacy-hidden combo class, so the change is reversible.

The heading and intro line above are still Webflow elements. Only the fields
and the submit button come from GoHighLevel.

The form renders in a cross-origin iframe, so the CSS here can only size and
frame it. Its colours and type are set in the GoHighLevel form builder - see
webflow/ghl-form-builder-custom-css.css in the Pathway-Property repo.

height/data-height must match the form's height in GoHighLevel (currently
796). form_embed.js resizes the iframe after load; this is the fallback.
-->
<style>
  .pp-ghl-form {
    width: 100%;
  }

  .pp-ghl-form iframe {
    display: block;
    width: 100%;
    border: none;
    background-color: transparent;
    overflow: hidden;
  }
</style>

<div class="pp-ghl-form">
  <iframe
    src="https://api.leadconnectorhq.com/widget/form/om3C2pvl8k921QOQIzZ3"
    style="width:100%;height:796px;border:none;background-color:transparent"
    id="inline-om3C2pvl8k921QOQIzZ3"
    data-layout="{'id':'INLINE'}"
    data-trigger-type="alwaysShow"
    data-trigger-value=""
    data-activation-type="alwaysActivated"
    data-activation-value=""
    data-deactivation-type="neverDeactivate"
    data-deactivation-value=""
    data-form-name="Website Enquiry Form"
    data-height="796"
    data-layout-iframe-id="inline-om3C2pvl8k921QOQIzZ3"
    data-form-id="om3C2pvl8k921QOQIzZ3"
    data-cookie-consent="true"
    data-cookie-consent-provider="auto"
    title="Website Enquiry Form"
    scrolling="no"
  ></iframe>
</div>
